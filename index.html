function krDate(d){
  if (!d) return '';
  var p = d.split('-');
  return p[0] + '년 ' + parseInt(p[1],10) + '월 ' + parseInt(p[2],10) + '일';
}

function money(m){
  if (m === null || m === undefined) return null;
  var eok = Math.floor(m / 10000);
  var man = m % 10000;
  if (eok === 0) return man.toLocaleString('ko-KR') + '만원';
  if (man === 0) return eok + '억원';
  return eok + '억 ' + man.toLocaleString('ko-KR') + '만원';
}

       + '</div>';
  }

  /* ── 5. 경고: 토허구역 ── */
  if (z.lpz) {
    h += '<div class="card danger">'
       + '<div class="ct">⚠ 전세를 끼고 살 수 없는 동네입니다</div>'
       + '<div class="cb">구청 허가를 받아야 하고, 직접 들어가 살아야 해요.'
       + (z.price ? '<br>그래서 ' + money(z.price) + '이 전부 현금으로 필요합니다.' : '')
       + '</div>'
       + '<div class="cn">↳ 부동산에서는 "토지거래허가구역"이라고 부릅니다</div>'
       + '</div>';
  }

  /* ── 6. 사업성 참고 ── */
  if (per) {
    h += '<div class="card info">'
       + '<div class="cb">이 동네는 집 한 채당 땅이 <b>' + per + '㎡</b>씩 돌아가요.'
       + ' 이 값이 클수록 새로 지을 때 여유가 생겨서, 나중에 낼 돈이 줄어드는 편입니다.</div>'
       + '</div>';
  }

  /* ── 7. 아직 확인 못 한 것 ── */
  if (z.todo) {
    h += '<div class="card todo">'
       + '<div class="ct2">아직 확인 못 한 것</div>'
       + '<div class="cb">' + z.todo + '<br>조합 사무실이나 구청에서 확인할 수 있어요.</div>'
       + '</div>';
  }

  /* ── 8. 출처 ── */
  h += '<div class="sc">서울시 공고와 정비사업 공개 자료를 바탕으로 만들었습니다.<br>'
     + '지도 위 위치는 대략적인 표시라 실제 구역 경계와 다릅니다.<br>'
     + '중요한 결정을 하기 전에는 반드시 원본 문서로 다시 확인하세요.</div>';

  document.getElementById('bd').innerHTML = h;
  document.getElementById('sh').classList.add('on');
}

} catch (e) {
  fail('<b>코드 오류</b><br><br>' + e.message);
}
</script>

</body>
</html>
