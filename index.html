<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ToadStep">
<title>ToadStep</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#141A11}
  #map{width:100%;height:100%}
  #hd{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 16px 16px;
      background:linear-gradient(rgba(251,251,248,.96) 60%,rgba(251,251,248,0));pointer-events:none}
  #hd b{font-size:17px}
  #hd b i{color:#3B6D11;font-style:normal}
  #hd div{font-size:12px;color:#5A6354;margin-top:2px}
  #lg{position:fixed;left:12px;bottom:12px;z-index:10;background:rgba(255,255,255,.95);
      border:1px solid #E2E5DE;border-radius:10px;padding:8px 11px;font-size:11px;line-height:1.9}
  #lg s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;text-decoration:none}
  #sh{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:20px 20px 0 0;
      box-shadow:0 -2px 22px rgba(20,26,17,.18);padding:10px 18px 26px;
      transform:translateY(101%);transition:transform .28s ease;max-height:78%;overflow-y:auto}
  #sh.on{transform:translateY(0)}
  .gr{width:38px;height:4px;border-radius:2px;background:#D5D9CF;margin:0 auto 14px}
  .nm{font-size:20px;font-weight:700}
  .sb{font-size:13px;color:#5A6354;margin-top:3px}
  .st{margin:12px 0;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.6}
  .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
  .c{background:#F4F6F1;border-radius:10px;padding:10px 11px}
  .c u{display:block;font-size:11px;color:#5A6354;text-decoration:none}
  .c b{display:block;font-size:17px;margin-top:2px}
  .c b.m{font-size:14px;font-weight:500;color:#9AA394}
  .fl{padding:11px 13px;border-radius:10px;background:#FBEAEA;color:#9E2626;font-size:13px;line-height:1.6;margin-bottom:8px}
  .td{padding:11px 13px;border-radius:10px;background:#FBEEE4;color:#5E2A08;font-size:13px;line-height:1.6}
  .sc{margin-top:12px;font-size:11px;color:#9AA394;line-height:1.6}
  .bt{margin-top:14px;width:100%;padding:14px;border:0;border-radius:12px;background:#F1F3EE;
      font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  #err{padding:90px 26px;font-size:15px;line-height:1.9}
</style>
</head>
<body>

<div id="map"></div>

<div id="hd">
  <b>Toad<i>Step</i></b>
  <div>서울 재개발 구역 23곳 · 핀을 눌러보세요</div>
</div>

<div id="lg">
  <div><s style="background:#3B6D11"></s>사업 진행 중</div>
  <div><s style="background:#C98A16"></s>후보지 선정 (2025)</div>
  <div><s style="background:#A8480F"></s>후보지 선정 (2026)</div>
</div>

<div id="sh"><div class="gr"></div><div id="bd"></div>
  <button class="bt" onclick="document.getElementById('sh').classList.remove('on')">닫기</button>
</div>

<script>
function fail(t){
  document.getElementById('map').innerHTML = '<div id="err">' + t + '</div>';
  document.getElementById('lg').style.display = 'none';
}
window.navermap_authFailure = function(){
  fail('<b>네이버 인증 실패</b><br><br>Web 서비스 URL 등록을 확인하세요.');
};
</script>

<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=q9fz900u8a"
        onerror="fail('<b>지도 스크립트 로딩 실패</b>')"></script>

  {n:'창신동 23 / 숭인동 56 일대',gu:'종로구',lat:37.5745,lng:127.0110,t:'run',

  {n:'독산동 979 일대',gu:'금천구',lat:37.4700,lng:126.8950,t:'y25',
   area:93990.7,own:null,memo:null,sel:'2025-12-16',rd:'2025-11-11',lpz:true,

  {n:'독산동 1022 일대',gu:'금천구',lat:37.4660,lng:126.8990,t:'y25',

  {n:'정릉동 16-179 일대',gu:'성북구',lat:37.6030,lng:127.0130,t:'y25',

  {n:'행당동 300-1 일대',gu:'성동구',lat:37.5590,lng:127.0290,t:'y25',

  {n:'수유동 310-15 일대',gu:'강북구',lat:37.6380,lng:127.0250,t:'y25',
   area:15944.5,own:null,memo:'가장 작은 구역',sel:'2025-12-16',rd:'2025-11-25',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'신사동 300 일대',gu:'은평구',lat:37.5960,lng:126.9130,t:'y25',
   area:30222.2,own:null,memo:'노후도 83% · 반지하 73%',sel:'2025-12-16',rd:'2025-11-27',lpz:true,
   todo:'토지등소유자 수 확인'},

  // 2026년 1차
  {n:'개봉동 66-15 일대',gu:'구로구',lat:37.4950,lng:126.8580,t:'y26',
   area:109371,own:null,memo:'노후도 70% · 반지하 50%↑',sel:'2026-02-23',rd:'2026-01-26',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'구로동 792-3 일대',gu:'구로구',lat:37.4900,lng:126.8880,t:'y26',
   area:58472.7,own:null,memo:'G밸리 인접',sel:'2026-02-23',rd:null,lpz:true,
   todo:'지번(792-3/792-33)·권리산정기준일 확인'},
  {n:'불광동 442 일대',gu:'은평구',lat:37.6120,lng:126.9270,t:'y26',

   todo:'토지등소유자 수 확인'},
  {n:'불광동 445 일대',gu:'은평구',lat:37.6150,lng:126.9300,t:'y26',
   area:89536.8,own:null,memo:'노후도 70% · 반지하 50%↑',sel:'2026-02-23',rd:null,lpz:true,
   todo:'권리산정기준일 확인'},
  {n:'옥천동 123-2 일대',gu:'서대문구',lat:37.5720,lng:126.9600,t:'y26',
   area:9863.5,own:null,memo:'동의율 70%↑ · 최소 규모',sel:'2026-02-23',rd:null,lpz:true,
   todo:'권리산정기준일 확인'},
  {n:'구의동 46 일대',gu:'광진구',lat:37.5450,lng:127.0870,t:'y26',
   area:105957.2,own:null,memo:'동의율 70%↑',sel:'2026-02-23',rd:'2026-01-27',lpz:true,
   todo:'토지등소유자 수 확인'},

  // 2026년 2차
  {n:'북가좌동 3-191 일대',gu:'서대문구',lat:37.5790,lng:126.9080,t:'y26',
   area:77001.2,own:null,memo:'반지하 밀집',sel:'2026-05-06',rd:null,lpz:'~2027-08-30',
   todo:'용도지역·권리산정기준일 확인'},
  {n:'연희동 170-14 일대',gu:'서대문구',lat:37.5700,lng:126.9330,t:'y26',
   area:35623.6,own:null,memo:'반지하 밀집',sel:'2026-05-06',rd:null,lpz:'~2027-08-30',
   todo:'용도지역·권리산정기준일 확인'},

  // 2026년 3차
  {n:'구의동 32 일대',gu:'광진구',lat:37.5410,lng:127.0850,t:'y26',
   area:29780.5,own:null,memo:'동의율 73% · 아차산역 인접',sel:'2026-07-29',rd:'2026-07-01',lpz:true,
   todo:'용도지역·토지등소유자 수 확인'},
  {n:'신길동 113-5 일대',gu:'영등포구',lat:37.5100,lng:126.9180,t:'y26',
   area:31677,own:null,memo:'노후도 81%',sel:'2026-07-29',rd:null,lpz:true,
   todo:'권리산정기준일 확인'},
  {n:'갈현동 510-1 일대',gu:'은평구',lat:37.6150,lng:126.9150,t:'y26',
   area:null,own:null,memo:'연신내 생활권 연계',sel:'2026-07-29',rd:null,lpz:true,
   todo:'구역면적·권리산정기준일 확인'}
];

var COLOR = {run:'#3B6D11', y25:'#C98A16', y26:'#A8480F'};
var STAGE = {
  run:{t:'이미 사업이 진행 중이에요. 정비구역 지정 단계입니다.',b:'#EDF4E4',f:'#26430D'},
  y25:{t:'2025년에 후보지로 뽑혔어요. 이제 계획을 세우는 중입니다.',b:'#FAF2E2',f:'#5C4207'},
  y26:{t:'올해 막 후보지로 뽑혔어요. 가장 이른 단계입니다.',b:'#FBEEE4',f:'#5E2A08'}
};

var map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.5560, 126.9800),
  zoom: 11
});

for (var i = 0; i < Z.length; i++) {
  (function(z){
    var r = z.area ? Math.max(190, Math.min(460, Math.sqrt(z.area) * 1.1)) : 190;
    var circle = new naver.maps.Circle({
      map: map,
      center: new naver.maps.LatLng(z.lat, z.lng),
      radius: r,
      fillColor: COLOR[z.t], fillOpacity: 0.45,
      strokeColor: COLOR[z.t], strokeWeight: 2,
      clickable: true
    });
    naver.maps.Event.addListener(circle, 'click', function(){ show(z); });
  })(Z[i]);
}

function num(n){ return n ? n.toLocaleString('ko-KR',{maximumFractionDigits:0}) : ''; }

function show(z){
  var s = STAGE[z.t];
  var per = (z.area && z.own) ? Math.round(z.area / z.own) : null;
  var h = '<div class="nm">' + z.n + '</div>'
    + '<div class="sb">' + z.gu + (z.memo ? ' · ' + z.memo : '') + '</div>'
    + '<div class="st" style="background:' + s.b + ';color:' + s.f + '">' + s.t + '</div>'
    + '<div class="g">'
    + '<div class="c"><u>구역면적</u><b' + (z.area?'':' class="m"') + '>' + (z.area ? num(z.area)+'㎡' : '미확인') + '</b></div>'
    + '<div class="c"><u>1인당 면적</u><b' + (per?'':' class="m"') + '>' + (per ? per+'㎡' : '소유자 수 미확인') + '</b></div>'
    + '<div class="c"><u>권리산정기준일</u><b style="font-size:15px"' + (z.rd?'':' class="m"') + '>' + (z.rd || '미확인') + '</b></div>'
    + '<div class="c"><u>후보지 선정</u><b style="font-size:15px"' + (z.sel?'':' class="m"') + '>' + (z.sel || '해당 없음') + '</b></div>'
    + '</div>';
  if (z.lpz) h += '<div class="fl">토지거래허가구역입니다'
    + (typeof z.lpz === 'string' ? ' (' + z.lpz + ')' : '')
    + '. 실거주 의무가 있어 전세를 낀 매수가 안 됩니다. 매매가 전액이 현금으로 필요해요.</div>';
  if (z.rd) h += '<div class="fl">이 날짜 뒤에 새로 짓거나 쪼갠 집은 입주권이 안 나옵니다. '
    + '매물을 볼 때 등기부등본 날짜를 반드시 대조하세요.</div>';
  if (per) h += '<div class="td" style="margin-bottom:8px">조합원 한 명당 ' + per + '㎡입니다. '
    + '이 값이 클수록 일반분양 여력이 커서 분담금 부담이 줄어드는 편이에요.</div>';
  h += '<div class="td">아직 확인 못 한 것: ' + z.todo + '</div>'
    + '<div class="sc">서울시 보도자료·정비사업 정보몽땅 기준. 위치는 법정동 단위 근사값이며 '
    + '실제 구역 경계와 다릅니다. 모든 값은 고시문 원문으로 다시 확인하세요.</div>';
  document.getElementById('bd').innerHTML = h;
  document.getElementById('sh').classList.add('on');
}

} catch (e) {
  fail('<b>코드 오류</b><br><br>' + e.message);
}

</body>
</html>
