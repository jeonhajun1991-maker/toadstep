<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ToadStep">
<meta name="theme-color" content="#1F3D14">
<title>ToadStep</title>
<link rel="icon" href="data:,">
<script>
/* 반드시 지도 스크립트보다 먼저 정의되어야 합니다 */
function tsFail(title, lines){
  var el = document.getElementById('map');
  if(!el) { window.__tsPending = [title, lines]; return; }
  el.innerHTML = '<div style="padding:110px 26px;line-height:1.95;font-size:15px;font-family:-apple-system,sans-serif">'
    + '<b style="font-size:18px">' + title + '</b><br><br>' + lines + '</div>';
}
window.navermap_authFailure = function(){
  tsFail('네이버 인증에 실패했어요',
    '키는 읽혔지만 이 주소에서 쓸 수 없다는 응답입니다.<br><br>'
    + '네이버 콘솔 → Maps → 애플리케이션 → <b>Web 서비스 URL</b>을 확인하세요.<br><br>'
    + '✅ https://jeonhajun1991-maker.github.io<br>'
    + '<span style="color:#9E2626">❌ 뒤에 /toadstep 을 붙이면 안 됩니다</span><br><br>'
    + '등록 후 1~2분 뒤 새로고침하세요.');
};
</script>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=q9fz900u8a"
        onerror="tsFail('지도 스크립트를 못 불러왔어요','키(ncpKeyId) 값이 콘솔의 Client ID와 같은지, Web Dynamic Map이 체크돼 있는지 확인하세요.')"></script>
<style>
  :root{
    --ink:#141A11; --soft:#5A6354; --line:#E2E5DE;
    --moss:#3B6D11; --moss-bg:#EDF4E4;
    --clay:#A8480F; --clay-bg:#FBEEE4;
    --alert:#9E2626; --alert-bg:#FBEAEA;
    --paper:#FBFBF8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
       color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
  #map{position:absolute;inset:0}

  header{position:absolute;top:0;left:0;right:0;z-index:10;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;
    background:linear-gradient(#FBFBF8 60%,rgba(251,251,248,0));pointer-events:none}
  .brand{font-size:17px;font-weight:700;letter-spacing:-.02em}
  .brand span{color:var(--moss)}
  .tag{font-size:12px;color:var(--soft);margin-top:2px}

  .legend{position:absolute;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:10;
    background:rgba(255,255,255,.94);border:.5px solid var(--line);border-radius:10px;
    padding:9px 11px;font-size:11px;line-height:1.9;box-shadow:0 1px 8px rgba(20,26,17,.08)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}

  .pin{transform:translate(-50%,-50%);border-radius:50%;border:2px solid #fff;
    box-shadow:0 1px 5px rgba(0,0,0,.32);cursor:pointer}

  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;background:#fff;
    border-radius:20px 20px 0 0;box-shadow:0 -2px 24px rgba(20,26,17,.16);
    padding:10px 18px calc(env(safe-area-inset-bottom) + 22px);
    transform:translateY(101%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    max-height:80%;overflow-y:auto}
  .sheet.on{transform:translateY(0)}
  .grip{width:38px;height:4px;border-radius:2px;background:#D5D9CF;margin:0 auto 15px}

  .zname{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .zsub{font-size:13px;color:var(--soft);margin-top:3px}
  .stage{margin:13px 0;padding:11px 13px;border-radius:11px;font-size:14px;line-height:1.6}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .cell{background:#F4F6F1;border-radius:10px;padding:10px 11px}
  .cell .k{font-size:11px;color:var(--soft)}
  .cell .v{font-size:17px;font-weight:600;margin-top:2px}
  .cell .v.mute{font-size:14px;font-weight:500;color:#9AA394}

  .flag{padding:11px 13px;border-radius:10px;background:var(--alert-bg);color:var(--alert);
    font-size:13px;line-height:1.6;margin-bottom:9px}
  .todo{padding:11px 13px;border-radius:10px;background:var(--clay-bg);color:#5E2A08;
    font-size:13px;line-height:1.6}
  .src{margin-top:13px;font-size:11px;color:#9AA394;line-height:1.6}
  .close{margin-top:15px;width:100%;padding:14px;border:0;border-radius:12px;
    background:#F1F3EE;color:var(--ink);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
</style>
</head>
<body>

<div id="map"></div>

<header>
  <div class="brand">Toad<span>Step</span></div>
  <div class="tag">서울 재개발 구역 23곳 · 핀을 눌러보세요</div>
</header>

<div class="legend">
  <div><span class="dot" style="background:#3B6D11"></span>사업 진행 중</div>
  <div><span class="dot" style="background:#C98A16"></span>후보지 선정 (2025)</div>
  <div><span class="dot" style="background:#A8480F"></span>후보지 선정 (2026)</div>
</div>

<div class="sheet" id="sheet">
  <div class="grip"></div>
  <div id="body"></div>
  <button class="close" onclick="closeSheet()">닫기</button>
</div>

<script>


/* ─────────────────────────────────────────────
   구역 데이터 (스프레드시트와 같은 내용)
   lat/lng는 법정동 단위 근사값 — 실제 구역 경계는
   V-World / 서울도시공간포털 GeoJSON으로 교체 필요
   ───────────────────────────────────────────── */
const Z = [
  // 진행 중 (정보몽땅 신통기획 1차)
  {n:'창신동 23 / 숭인동 56 일대',gu:'종로구',lat:37.5745,lng:127.0110,t:'run',
   area:104853,own:711,memo:'창신역(6호선) 역세권',sel:null,rd:null,lpz:null,
   todo:'권리산정기준일·현재 단계 확인'},
  {n:'청파2구역',gu:'용산구',lat:37.5450,lng:126.9680,t:'run',
   area:82360,own:1505,memo:'배문중·고 인접',sel:null,rd:null,lpz:null,
   todo:'권리산정기준일·현재 단계 확인'},
  {n:'마장동 382 일대',gu:'성동구',lat:37.5665,lng:127.0430,t:'run',
   area:17824.84,own:136,memo:'마장역(5호선) 역세권',sel:null,rd:null,lpz:null,
   todo:'권리산정기준일·현재 단계 확인'},
  {n:'청량리동 19 일대',gu:'동대문구',lat:37.5840,lng:127.0450,t:'run',
   area:28647,own:339,memo:'청량중·고 인접',sel:null,rd:null,lpz:null,
   todo:'권리산정기준일·현재 단계 확인'},

  // 2025년 6차 선정
  {n:'독산동 979 일대',gu:'금천구',lat:37.4700,lng:126.8950,t:'y25',
   area:93990.7,own:null,memo:null,sel:'2025-12-16',rd:'2025-11-11',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'독산동 1022 일대',gu:'금천구',lat:37.4660,lng:126.8990,t:'y25',
   area:83203,own:null,memo:'기존 재개발구역과 연접',sel:'2025-12-16',rd:'2025-11-28',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'신길동 90-31 일대',gu:'영등포구',lat:37.5060,lng:126.9150,t:'y25',
   area:58162,own:null,memo:null,sel:'2025-12-16',rd:'2025-11-26',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'정릉동 16-179 일대',gu:'성북구',lat:37.6030,lng:127.0130,t:'y25',
   area:42810.6,own:null,memo:null,sel:'2025-12-16',rd:'2025-11-17',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'행당동 300-1 일대',gu:'성동구',lat:37.5590,lng:127.0290,t:'y25',
   area:66276.1,own:null,memo:null,sel:'2025-12-16',rd:'2025-09-01',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'신수동 250 일대',gu:'마포구',lat:37.5480,lng:126.9370,t:'y25',
   area:44718.7,own:null,memo:null,sel:'2025-12-16',rd:'2025-11-25',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'수유동 310-15 일대',gu:'강북구',lat:37.6380,lng:127.0250,t:'y25',
   area:15944.5,own:null,memo:'가장 작은 구역',sel:'2025-12-16',rd:'2025-11-25',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'신사동 300 일대',gu:'은평구',lat:37.5960,lng:126.9130,t:'y25',
   area:30222.2,own:null,memo:'노후도 83% · 반지하 73%',sel:'2025-12-16',rd:'2025-11-27',lpz:true,
   todo:'토지등소유자 수 확인'},

  // 2026년 1차
  {n:'개봉동 66-15 일대',gu:'구로구',lat:37.4950,lng:126.8580,t:'y26',
   area:109371,own:null,memo:'노후도 70% · 반지하 50%↑',sel:'2026-02-23',rd:'2026-01-26',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'구로동 792-3 일대',gu:'구로구',lat:37.4900,lng:126.8880,t:'y26',
   area:58472.7,own:null,memo:'G밸리 인접',sel:'2026-02-23',rd:null,lpz:true,
   todo:'지번(792-3/792-33)·권리산정기준일 확인'},
  {n:'불광동 442 일대',gu:'은평구',lat:37.6120,lng:126.9270,t:'y26',
   area:109364.8,own:null,memo:'노후도 70% · 반지하 50%↑',sel:'2026-02-23',rd:'2026-01-27',lpz:true,
   todo:'토지등소유자 수 확인'},
  {n:'불광동 445 일대',gu:'은평구',lat:37.6150,lng:126.9300,t:'y26',
   area:89536.8,own:null,memo:'노후도 70% · 반지하 50%↑',sel:'2026-02-23',rd:null,lpz:true,
   todo:'권리산정기준일 확인'},
  {n:'옥천동 123-2 일대',gu:'서대문구',lat:37.5720,lng:126.9600,t:'y26',
   area:9863.5,own:null,memo:'동의율 70%↑ · 최소 규모',sel:'2026-02-23',rd:null,lpz:true,
   todo:'권리산정기준일 확인'},
  {n:'구의동 46 일대',gu:'광진구',lat:37.5450,lng:127.0870,t:'y26',
   area:105957.2,own:null,memo:'동의율 70%↑',sel:'2026-02-23',rd:'2026-01-27',lpz:true,
   todo:'토지등소유자 수 확인'},

  // 2026년 2차
  {n:'북가좌동 3-191 일대',gu:'서대문구',lat:37.5790,lng:126.9080,t:'y26',
   area:77001.2,own:null,memo:'반지하 밀집',sel:'2026-05-06',rd:null,lpz:'~2027-08-30',
   todo:'용도지역·권리산정기준일 확인'},
  {n:'연희동 170-14 일대',gu:'서대문구',lat:37.5700,lng:126.9330,t:'y26',
   area:35623.6,own:null,memo:'반지하 밀집',sel:'2026-05-06',rd:null,lpz:'~2027-08-30',
   todo:'용도지역·권리산정기준일 확인'},

  // 2026년 3차
  {n:'구의동 32 일대',gu:'광진구',lat:37.5410,lng:127.0850,t:'y26',
   area:29780.5,own:null,memo:'동의율 73% · 아차산역 인접',sel:'2026-07-29',rd:'2026-07-01',lpz:true,
   todo:'용도지역·토지등소유자 수 확인'},
  {n:'신길동 113-5 일대',gu:'영등포구',lat:37.5100,lng:126.9180,t:'y26',
   area:31677,own:null,memo:'노후도 81%',sel:'2026-07-29',rd:null,lpz:true,
   todo:'권리산정기준일 확인'},
  {n:'갈현동 510-1 일대',gu:'은평구',lat:37.6150,lng:126.9150,t:'y26',
   area:null,own:null,memo:'연신내 생활권 연계',sel:'2026-07-29',rd:null,lpz:true,
   todo:'구역면적·권리산정기준일 확인'}
];

const COLOR = {run:'#3B6D11', y25:'#C98A16', y26:'#A8480F'};
const STAGE = {
  run:{txt:'이미 사업이 진행 중이에요. 정비구역 지정 단계입니다.',bg:'#EDF4E4',fg:'#26430D'},
  y25:{txt:'2025년에 후보지로 뽑혔어요. 이제 계획을 세우는 중입니다.',bg:'#FAF2E2',fg:'#5C4207'},
  y26:{txt:'올해 막 후보지로 뽑혔어요. 가장 이른 단계입니다.',bg:'#FBEEE4',fg:'#5E2A08'}
};

if (typeof naver === 'undefined' || !naver.maps) {
  tsFail('지도를 불러오지 못했어요',
    '네이버 지도 스크립트가 실행되지 않았습니다.<br><br>'
    + '① 콘솔의 Client ID와 코드의 키가 같은지<br>'
    + '② Web Dynamic Map이 체크돼 있는지<br>'
    + '③ Web 서비스 URL이 https://jeonhajun1991-maker.github.io 인지<br><br>'
    + '세 가지를 확인해보세요.');
  throw new Error('naver maps not loaded');
}

const map = new naver.maps.Map('map',{
  center:new naver.maps.LatLng(37.5560,126.9800),
  zoom:11, mapDataControl:false,
  logoControlOptions:{position:naver.maps.Position.BOTTOM_RIGHT}
});

/* 면적에 따라 핀 크기를 다르게 — 큰 구역이 눈에 띄게 */
function sizeOf(a){ if(!a) return 14; return Math.max(13, Math.min(30, Math.sqrt(a)/11)); }

Z.forEach(z=>{
  const s = sizeOf(z.area);
  const m = new naver.maps.Marker({
    map:map, position:new naver.maps.LatLng(z.lat,z.lng),
    icon:{ content:`<div class="pin" style="width:${s}px;height:${s}px;background:${COLOR[z.t]}"></div>`,
           anchor:new naver.maps.Point(0,0) }
  });
  naver.maps.Event.addListener(m,'click',()=>open(z));
});

const sheet=document.getElementById('sheet'), body=document.getElementById('body');

const fmt=n=>n?n.toLocaleString('ko-KR',{maximumFractionDigits:0}):null;

function open(z){
  const st=STAGE[z.t];
  const per = (z.area&&z.own) ? Math.round(z.area/z.own) : null;

  let h = `<div class="zname">${z.n}</div>
    <div class="zsub">${z.gu}${z.memo?' · '+z.memo:''}</div>
    <div class="stage" style="background:${st.bg};color:${st.fg}">${st.txt}</div>
    <div class="grid">
      <div class="cell"><div class="k">구역면적</div>
        <div class="v${z.area?'':' mute'}">${z.area?fmt(z.area)+'㎡':'미확인'}</div></div>
      <div class="cell"><div class="k">1인당 면적</div>
        <div class="v${per?'':' mute'}">${per?per+'㎡':'소유자 수 미확인'}</div></div>
      <div class="cell"><div class="k">권리산정기준일</div>
        <div class="v${z.rd?'':' mute'}" style="font-size:15px">${z.rd||'미확인'}</div></div>
      <div class="cell"><div class="k">후보지 선정</div>
        <div class="v${z.sel?'':' mute'}" style="font-size:15px">${z.sel||'해당 없음'}</div></div>
    </div>`;

  if(z.lpz) h += `<div class="flag">토지거래허가구역입니다${typeof z.lpz==='string'?' ('+z.lpz+')':''}.
    실거주 의무가 있어 전세를 낀 매수가 안 됩니다. 매매가 전액이 현금으로 필요해요.</div>`;

  if(z.rd) h += `<div class="flag">이 날짜 뒤에 새로 짓거나 쪼갠 집은 입주권이 안 나옵니다.
    매물을 볼 때 등기부등본 날짜를 반드시 대조하세요.</div>`;

  if(per) h += `<div class="todo">조합원 한 명당 ${per}㎡입니다.
    이 값이 클수록 일반분양 여력이 커서 분담금 부담이 줄어드는 편이에요.</div>`;

  h += `<div class="todo" style="margin-top:9px">아직 확인 못 한 것: ${z.todo}</div>
    <div class="src">서울시 보도자료·정비사업 정보몽땅 기준. 좌표는 법정동 단위 근사값이며
    실제 구역 경계와 다릅니다. 모든 값은 고시문 원문으로 다시 확인하세요.</div>`;

  body.innerHTML=h;
  sheet.classList.add('on');
  map.panTo(new naver.maps.LatLng(z.lat-0.012, z.lng));
}
function closeSheet(){ sheet.classList.remove('on'); }
</script>
</body>
</html>
