<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ToadStep">
<title>ToadStep</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --brand-900:#0F3D28; --brand-700:#17734A; --brand-500:#1E9B62;
    --brand-300:#7FD1A8; --brand-050:#EAF6F0; --brand-brd:#BFE3D0;
    --n-900:#101413; --n-800:#1D2422; --n-700:#3A4442; --n-600:#5A6663;
    --n-500:#7E8A87; --n-400:#A9B3B0; --n-300:#CDD5D2; --n-200:#E4E9E7;
    --n-100:#F1F4F3; --n-050:#F8FAF9;
    --amber:#B7791F; --amber-bg:#FDF6E7; --amber-brd:#F0DFB8;
    --danger:#B3402B; --danger-bg:#FBEEEB; --danger-brd:#EED0C8;
    --info:#2F5DA8; --info-bg:#EDF2FB; --info-brd:#CFDCF2;
    --radius:14px; --radius-sm:8px;
    --shadow-sheet:0 -1px 0 var(--n-200), 0 -12px 32px rgba(16,20,19,.06);
  }

  html,body{margin:0;padding:0;width:100%;height:100vh;min-height:100vh;overflow:hidden;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',system-ui,sans-serif;color:var(--n-900)}
  #map{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100vh}
  #hd{position:fixed;top:0;left:0;right:0;z-index:10;padding:14px 16px 16px;
      background:linear-gradient(rgba(248,250,249,.96) 60%,rgba(248,250,249,0));pointer-events:none}
  #hd b{font-size:17px}
  #hd b i{color:var(--brand-500);font-style:normal}
  #hd div{font-size:12px;color:var(--n-600);margin-top:2px}
  #lg{position:fixed;left:12px;bottom:12px;z-index:10;background:rgba(255,255,255,.95);
      border:1px solid var(--n-200);border-radius:10px;padding:8px 11px;font-size:11px;line-height:1.9}
  #lg s{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;text-decoration:none}
  #sh{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:20px 20px 0 0;
      box-shadow:var(--shadow-sheet);padding:10px 20px 30px;
      transform:translateY(101%);transition:transform .38s cubic-bezier(.22,.61,.36,1);max-height:88%;overflow-y:auto}
  #sh.on{transform:translateY(0)}
  .gr{width:38px;height:4px;border-radius:2px;background:var(--n-300);margin:0 auto 14px}
  .nm{font-size:21px;font-weight:800;letter-spacing:-.02em;line-height:1.35}
  .sb{font-size:13px;color:var(--n-600);margin-top:4px}
  .st{margin:13px 0 22px;padding:12px 14px;border-radius:11px;
      background:var(--brand-050);color:var(--brand-700);font-size:14px;line-height:1.6}

  .lbl{font-size:13px;color:var(--n-600)}
  .big{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:2px 0 8px}
  .big.mute{font-size:19px;font-weight:600;color:var(--n-500)}
  .p1{font-size:15px;line-height:1.7}
  .p2{font-size:13px;color:var(--n-600);line-height:1.7}

  .card{margin-top:18px;padding:14px 15px;border-radius:12px}
  .card .ct{font-size:16px;font-weight:700;line-height:1.5}
  .card .ct2{font-size:14px;font-weight:600;margin-bottom:6px}
  .card .cb{font-size:13.5px;line-height:1.75;margin-top:8px}
  .card .cn{font-size:12px;line-height:1.6;margin-top:10px;opacity:.75}
  .card.warn{background:var(--amber-bg);color:#6B4A12;border:1px solid var(--amber-brd)}
  .card.warn .ct{color:var(--amber)}
  .card.danger{background:var(--danger-bg);color:#7A2A1B;border:1px solid var(--danger-brd)}
  .card.danger .ct{color:var(--danger)}
  .card.info{background:var(--info-bg);color:#22406F;border:1px solid var(--info-brd)}
  .card.todo{background:var(--n-050);color:var(--n-700);border:1px solid var(--n-200)}

  /* 한 줄씩 스르륵 올라오는 등장 효과 */
  @keyframes rise{
    from{opacity:0; transform:translateY(20px) scale(.98)}
    to  {opacity:1; transform:translateY(0)   scale(1)}
  }
  #bd > *{opacity:0; animation:rise .62s cubic-bezier(.22,.61,.36,1) forwards}
  @media (prefers-reduced-motion:reduce){
    #bd > *{opacity:1; animation:none}
  }

  /* 예시 데이터 경고 */
  #demo{position:fixed;top:0;left:0;right:0;z-index:60;
        background:#9E2626;color:#fff;font-size:12px;font-weight:600;
        text-align:center;padding:calc(env(safe-area-inset-top) + 7px) 12px 7px;
        letter-spacing:-.01em}
  body.demo #hd{padding-top:calc(env(safe-area-inset-top) + 42px)}
  .dchip{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;
         border-radius:5px;background:#9E2626;color:#fff;margin-left:6px;vertical-align:1px}

  .back{font-size:13px;color:var(--brand-700);font-weight:600;padding:4px 0 10px;cursor:pointer}

  /* ── 판정 카드 ── */
  .verdict{border-radius:14px;padding:15px;margin-bottom:14px}
  .verdict.bad{background:var(--danger-bg);border:1px solid var(--danger-brd)}
  .verdict.warn{background:var(--amber-bg);border:1px solid var(--amber-brd)}
  .verdict.ok{background:var(--brand-050);border:1px solid var(--brand-brd)}
  .verdict .vt{font-size:11px;font-weight:800;letter-spacing:.06em;margin-bottom:5px}
  .verdict.bad .vt{color:var(--danger)}
  .verdict.warn .vt{color:var(--amber)}
  .verdict.ok .vt{color:var(--brand-700)}
  .verdict .vh{font-size:19px;font-weight:800;letter-spacing:-.02em;line-height:1.3;
               margin-bottom:5px;color:var(--n-900)}
  .verdict .vd{font-size:12.5px;color:var(--n-700);line-height:1.6}

  /* ── 지표 행 ── */
  .metric{padding:12px 0;border-top:1px solid var(--n-200)}
  .metric:first-of-type{border-top:0;padding-top:2px}
  .metric .mrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .metric .mlab{font-size:12px;font-weight:700;color:var(--n-600)}
  .metric .mval{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .metric .mval.na{font-size:13px;font-weight:600;color:var(--n-500)}
  .metric .msub{font-size:11.5px;color:var(--n-500);line-height:1.55;margin-top:3px}

  /* ── 단계 타임라인 ── */
  .timeline{display:flex;margin:10px 0 4px}
  .tl-step{flex:1;text-align:center;position:relative;font-size:9.5px;color:var(--n-500);line-height:1.35}
  .tl-step .dot2{width:11px;height:11px;border-radius:50%;background:var(--n-300);
                 margin:0 auto 5px;border:2px solid #fff;position:relative;z-index:2}
  .tl-step.done .dot2{background:var(--brand-500)}
  .tl-step.now .dot2{background:var(--brand-700);width:15px;height:15px;margin-top:-2px;
                     box-shadow:0 0 0 3px var(--brand-050)}
  .tl-step.now{color:var(--brand-700);font-weight:700}
  .tl-step::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;
                   background:var(--n-200);z-index:1}
  .tl-step:first-child::before{display:none}
  .tl-step.done::before,.tl-step.now::before{background:var(--brand-300)}

  /* ── 단계 배지 ── */
  .stage-badge{display:inline-flex;align-items:center;gap:5px;background:var(--n-100);
       border:1px solid var(--n-200);border-radius:20px;padding:3px 10px;font-size:11px;
       font-weight:700;color:var(--n-700);white-space:nowrap}

  /* ── 근거 표 ── */
  .basis{font-size:11.5px;color:var(--n-600);line-height:1.6}
  .basis .kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;
             border-bottom:1px solid var(--n-200)}
  .basis .kv:last-child{border:0}
  .basis .v{font-weight:700;color:var(--n-800);text-align:right}

  /* ── 체크 항목 ── */
  .flag{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid var(--n-200);align-items:flex-start}
  .flag:last-child{border:0}
  .flag .fi{flex:0 0 18px;font-size:14px;line-height:1.35}
  .flag .ft{font-size:12.5px;font-weight:700;color:var(--n-800);margin-bottom:2px}
  .flag .fd{font-size:11px;color:var(--n-600);line-height:1.5}
  .flag.hit .ft{color:var(--danger)}

  /* ── 안내 박스 ── */
  .excl{background:var(--info-bg);border:1px solid var(--info-brd);border-radius:9px;
        padding:10px 12px;font-size:11px;color:var(--info);line-height:1.55;margin:12px 0}

  /* ── 버튼 ── */
  .cta{display:block;width:100%;border:0;border-radius:11px;padding:13px;font:inherit;
       font-size:14px;font-weight:700;cursor:pointer;text-align:center;margin-top:12px}
  .cta.pri{background:var(--brand-700);color:#fff}
  .cta.sec{background:#fff;color:var(--brand-700);border:1px solid var(--brand-300)}
  .cta.ghost{background:var(--n-100);color:var(--n-700)}

  /* ── 하단 고정 금액바 ── */
  .cashbar{position:sticky;bottom:0;margin:14px -20px -30px;background:#fff;
     border-top:1px solid var(--n-200);padding:13px 20px calc(env(safe-area-inset-bottom) + 16px);
     box-shadow:0 -6px 20px rgba(16,20,19,.06);z-index:5}
  .cashbar .row{display:flex;align-items:baseline;justify-content:space-between}
  .cashbar .lab{font-size:11px;font-weight:700;color:var(--n-500);letter-spacing:.03em}
  .cashbar .val{font-size:21px;font-weight:800;letter-spacing:-.025em;color:var(--n-900)}
  .cashbar .hint{font-size:11px;color:var(--n-500);margin-top:6px;display:flex;justify-content:space-between}
  .cashbar .hint b{color:var(--brand-700);font-weight:700}

  /* ── 세그먼트 (탭 대체) ── */
  .seg{display:flex;background:var(--n-100);border-radius:10px;padding:3px;gap:3px;margin:15px 0 6px}
  .seg button{flex:1;border:0;background:none;font:inherit;font-size:12.5px;font-weight:700;
       color:var(--n-600);padding:9px 4px;border-radius:7px;cursor:pointer}
  .seg button.on{background:#fff;color:var(--brand-700);box-shadow:0 1px 2px rgba(16,20,19,.08)}

  /* 탭 */
  .tabs{display:flex;gap:6px;margin:16px 0 4px;position:sticky;top:0;z-index:2;
        background:#fff;padding:4px 0 8px}
  .tabs button{flex:1;padding:11px 0;border:0;border-radius:10px;font-family:inherit;
        font-size:14px;font-weight:600;background:#F1F3EE;color:var(--n-600);cursor:pointer;
        transition:background .18s,color .18s}
  .tabs button.on{background:var(--brand-700);color:#fff}
  .tabs button span{font-weight:400;opacity:.75;font-size:12px}

  /* 매물 */
  .lsec{margin-top:24px}
  .lhd{font-size:15px;font-weight:700;margin-bottom:10px}
  .lhd span{font-weight:400;color:var(--n-600);font-size:13px}

  .li{border:1px solid var(--n-200);border-radius:var(--radius);padding:15px;margin-bottom:10px;cursor:pointer}
  .li:active{background:var(--n-050)}
  .li .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .li .cash{font-size:20px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
  .li .cash u{text-decoration:none;font-size:13px;font-weight:500;color:var(--n-600);
              display:block;margin-top:2px}
  .li .kind{font-size:11px;color:var(--n-600);background:var(--n-100);padding:4px 9px;
            border-radius:20px;white-space:nowrap;flex-shrink:0}
  .li .fin{margin-top:11px;padding:10px 12px;border-radius:10px;background:var(--brand-050);border:1px solid var(--brand-brd)}
  .li .fin div{display:flex;justify-content:space-between;align-items:baseline;font-size:14px}
  .li .fin div.sm{font-size:12.5px;margin-top:3px;color:var(--n-600)}
  .li .fin span{color:var(--n-600);font-size:12.5px}
  .li .fin b{font-weight:700;letter-spacing:-.02em}
  .li .fin div.sm b{font-weight:600}

  .li .rows{margin-top:11px;padding-top:11px;border-top:1px solid var(--n-200);
            font-size:13px;line-height:1.85;color:#3C4436}
  .li .rows b{font-weight:600}
  .li .ag{font-size:11px;color:var(--n-500);margin-top:9px}

  .card.total{background:var(--brand-900);color:#E6F4EC}
  .card.total .tt{font-size:13px;opacity:.85}
  .card.total .tv{font-size:32px;font-weight:700;letter-spacing:-.035em;margin:3px 0 2px}
  .card.total .tr{font-size:13px;opacity:.8}
  .card.total .tb{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.2);
                  font-size:13.5px;line-height:2}
  .card.total .tb div{display:flex;justify-content:space-between}
  .card.total .tb span{opacity:.8}
  .card.total .tb b{font-weight:600}
  .card.total .tn{margin-top:13px;font-size:12px;line-height:1.7;opacity:.75}

  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;
       border-radius:5px;letter-spacing:.02em;border:1px solid transparent;
       margin:7px 5px 0 0;white-space:nowrap}
  .tag.lo{background:var(--brand-050);color:var(--brand-700);border-color:var(--brand-brd)}
  .tag.hi{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-brd)}
  .tag.risk{background:var(--danger-bg);color:var(--danger);border-color:var(--danger-brd)}
  .tag.ok{background:var(--info-bg);color:var(--info);border-color:var(--info-brd)}

  /* 범위 막대 */
  .bandbar{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.25);
           margin:11px 0 7px}
  .bandbar .fill{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--brand-300)}
  .bandbar .p50{position:absolute;top:-3px;width:2px;height:13px;background:#fff;border-radius:1px}
  .bandlab{display:flex;justify-content:space-between;font-size:11px;opacity:.8}

  .sc{margin-top:22px;font-size:11px;color:var(--n-500);line-height:1.7}
  .bt{margin-top:18px;width:100%;padding:15px;border:0;border-radius:12px;background:#F1F3EE;
      font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;color:#141A11}
  .zlab{transform:translate(-50%,-50%);white-space:nowrap;text-align:center;
        pointer-events:none;font-weight:600;letter-spacing:-.02em;
        text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff,0 0 5px #fff}
  .zlab b{display:block;font-size:11.5px;line-height:1.25}
  .zlab i{display:block;font-style:normal;font-size:10px;font-weight:500;opacity:.85;margin-top:1px}
  #err{padding:90px 26px;font-size:15px;line-height:1.9}
</style>
</head>
<body>

<div id="map"></div>

<div id="hd">
  <b>Toad<i>Step</i></b>
  <div>재개발 218곳 · 모아타운 131곳</div>
</div>

<div id="demo" style="display:none">⚠ 매물은 전부 예시입니다 · 실제 매물이 아닙니다</div>

<div id="hint" style="position:fixed;left:50%;transform:translateX(-50%);
     bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:11;
     background:var(--brand-900);color:#E6F4EC;font-size:12px;
     padding:8px 14px;border-radius:20px;pointer-events:none">
  확대하면 구역 이름이 보여요
</div>

<div id="lg">
  <div><s style="background:#B3402B"></s>아주 초기</div>
  <div><s style="background:#B7791F"></s>조합 만드는 중</div>
  <div><s style="background:#17734A"></s>설계 승인</div>
  <div><s style="background:#7E8A87"></s>원칙상 매수 불가</div>
  <div><s style="background:#2F5DA8"></s>모아타운·가로주택</div>
</div>

<div id="sh"><div class="gr"></div><div id="bd"></div>
  <button class="bt" onclick="document.getElementById('sh').classList.remove('on')">닫기</button>
</div>

<script>
function fail(t){
  document.getElementById('map').innerHTML = '<div id="err">' + t + '</div>';
  document.getElementById('lg').style.display = 'none';
}
window.navermap_authFailure = function(){
  fail('<b>네이버 인증 실패</b><br><br>Web 서비스 URL 등록을 확인하세요.');
};
</script>

<script src="zones.js"></script>
<script src="small.js"></script>
<script src="listings.js"></script>
<script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=q9fz900u8a"
        onerror="fail('<b>지도 스크립트 로딩 실패</b>')"></script>

<script>
try {


var COLOR = {
  jijeong:'#B3402B', chujin:'#B3402B', johap:'#B7791F',
  simui:'#B7791F', saeop:'#17734A', gwanri:'#7E8A87', chakgong:'#A9B3B0'
};
var STAGE_TXT = {
  jijeong:'재개발할 동네로 정해졌어요. 아직 주민 모임도 없는 초기 단계입니다',
  chujin :'주민 모임(추진위)이 만들어졌어요. 조합을 준비하는 중입니다',
  johap  :'주민 대표 조직이 만들어졌어요. 어떤 아파트를 지을지 정하는 중입니다',
  simui  :'건물 설계를 심사받는 중이에요. 곧 사업 승인이 납니다',
  saeop  :'설계 승인이 났어요. 곧 집집마다 값을 매기는 절차가 시작됩니다',
  gwanri :'낼 돈과 받을 평형이 다 정해졌어요. 이제 이사 준비 단계입니다',
  chakgong:'이미 공사가 시작됐어요'
};

/* 이 단계부터는 서울에서 사도 조합원이 안 됩니다 */
var TOO_LATE = {gwanri:1, chakgong:1};

/* 지도 라벨에 쓸 짧은 단계 이름 */
var SMALL_COLOR = {moa:'#2F5DA8', garo:'#5B84C4'};
var SMALL_NAME  = {moa:'모아타운', garo:'가로주택'};

var STAGE_SHORT = {
  jijeong:'구역지정', chujin:'추진위', johap:'조합설립',
  simui:'건축심의', saeop:'사업시행', gwanri:'관리처분', chakgong:'착공'
};

var map = new naver.maps.Map('map', {
  center: new naver.maps.LatLng(37.5560, 126.9750),
  zoom: 11, minZoom: 10, scaleControl: false, mapDataControl: false
});

var Z = [];
var bounds = new naver.maps.LatLngBounds();

if (typeof DEMO_MODE !== 'undefined' && DEMO_MODE) {
  document.getElementById('demo').style.display = 'block';
  document.body.classList.add('demo');
}

var labels = [];

GEO.features.forEach(function(f){
  var p = f.properties;
  var path = f.geometry.coordinates[0].map(function(c){
    return new naver.maps.LatLng(c[1], c[0]);
  });
  var col = COLOR[p.stage] || '#5A6354';
  var poly = new naver.maps.Polygon({
    map: map, paths: [path],
    fillColor: col, fillOpacity: 0.38,
    strokeColor: col, strokeWeight: 1.6, clickable: true
  });
  naver.maps.Event.addListener(poly, 'click', function(){ show(p); });

  /* 구역 이름 + 현재 단계 라벨 */
  var lab = new naver.maps.Marker({
    position: new naver.maps.LatLng(p.lat, p.lng),
    icon: {
      content: '<div class="zlab" style="color:' + col + '">'
             + '<b>' + p.nm + '</b>'
             + '<i>' + (STAGE_SHORT[p.stage] || '') + '</i></div>',
      anchor: new naver.maps.Point(0, 0)
    },
    clickable: false, zIndex: 50
  });
  labels.push(lab);

  bounds.extend(new naver.maps.LatLng(p.lat, p.lng));
  Z.push(p);
});

/* 줌이 낮으면 글자가 겹치므로 일정 배율부터만 보여줍니다 */
function syncLabels(){
  var on = map.getZoom() >= 14;
  for (var i = 0; i < labels.length; i++) {
    labels[i].setMap(on ? map : null);
  }
  var g = document.getElementById('hint');
  if (g) g.style.display = on ? 'none' : 'block';
}
naver.maps.Event.addListener(map, 'zoom_changed', syncLabels);
naver.maps.Event.addListener(map, 'idle', syncLabels);

/* ── 모아타운·가로주택 등 소규모 정비사업 ── */
if (typeof SMALL !== 'undefined') {
  SMALL.features.forEach(function(f){
    var p = f.properties;
    var path = f.geometry.coordinates[0].map(function(c){
      return new naver.maps.LatLng(c[1], c[0]);
    });
    var col = SMALL_COLOR[p.kind] || '#8A5FBF';
    var poly = new naver.maps.Polygon({
      map: map, paths: [path],
      fillColor: col, fillOpacity: 0.34,
      strokeColor: col, strokeWeight: 1.4, clickable: true
    });
    naver.maps.Event.addListener(poly, 'click', function(){ showSmall(p); });

    var lab = new naver.maps.Marker({
      position: new naver.maps.LatLng(p.lat, p.lng),
      icon: { content: '<div class="zlab" style="color:' + col + '">'
                     + '<b>' + p.nm.replace(/\s*소규모주택정비\s*관리지역\s*$/,'').replace(/\s*가로주택정비사업\s*$/,'').replace(/번지\s*일대\s*$/,'') + '</b>'
                     + '<i>' + (SMALL_NAME[p.kind]||'') + '</i></div>',
              anchor: new naver.maps.Point(0,0) },
      clickable:false, zIndex:40
    });
    labels.push(lab);
    bounds.extend(new naver.maps.LatLng(p.lat, p.lng));
  });
}

map.fitBounds(bounds, {top:96, right:24, bottom:110, left:24});

function krDate(d){
  if (!d) return '';
  var p = d.split('-');
  return p[0] + '년 ' + parseInt(p[1],10) + '월 ' + parseInt(p[2],10) + '일';
}

function money(m){
  if (m === null || m === undefined) return null;
  var eok = Math.floor(m / 10000);
  var man = m % 10000;
  if (eok === 0) return man.toLocaleString('ko-KR') + '만원';
  if (man === 0) return eok + '억원';
  return eok + '억 ' + man.toLocaleString('ko-KR') + '만원';
}

function spanLine(p){
  var REST = {
    jijeong:{y:13,n:87}, chujin:{y:12,n:87}, johap:{y:9,n:87},
    simui:{y:4,n:87},    saeop:{y:2,n:87}
  };
  var r = REST[p.stage] || REST.johap;
  return '집집마다 값을 매기는 절차가 끝나야 계산돼요.<br>'
       + '서울에서 실제로 끝난 <b>' + r.n + '곳</b>을 보면, 지금 이 단계에서 거기까지 '
       + '<b>보통 ' + r.y + '년</b>쯤 더 걸렸습니다.';
}

/* 자식 요소마다 조금씩 늦게 나타나게 */
function won(m){
  if (m == null) return '-';
  var eok = Math.floor(m/10000), man = m%10000;
  if (eok === 0) return man.toLocaleString('ko-KR') + '만';
  if (man === 0) return eok + '억';
  return eok + '억 ' + man.toLocaleString('ko-KR') + '만';
}

/* 대지지분 평당가 (만원) */
function perPyeong(price, land){
  if (!price || !land) return null;
  return Math.round(price / (land / 3.3058));
}

/* 취득세 — 철거 전 주택 기준. 6억 이하 1%, 9억 이하 누진, 초과 3% */
function acqTax(price){
  var eok = price / 10000;
  var rate;
  if (eok <= 60000/10000) rate = 0.01;
  else if (eok <= 9) rate = (eok * 2/3 - 3) / 100;
  else rate = 0.03;
  return Math.round(price * rate * 1.1);   /* 지방교육세 등 개략 포함 */
}

function pyeong(sqm){ return sqm ? Math.round(sqm / 3.3058 * 10) / 10 : null; }

/* 전세보증금 문자열에서 금액(만원) 추출 */
function deposit(t){
  if (!t) return 0;
  var m = String(t).match(/전세\s*([\d.]+)\s*억/);
  if (m) return Math.round(parseFloat(m[1]) * 10000);
  return 0;
}

function listingsOf(zoneName){
  if (typeof LISTINGS === 'undefined') return [];
  var key = String(zoneName).replace(/\s/g,'');
  return LISTINGS.filter(function(l){
    return l.agency && key.indexOf(String(l.zone).replace(/\s/g,'')) === 0;
  });
}

/* 이 동네 평당가 평균 — 비싼지 싼지 판단의 기준 */
function zoneAvgPP(ls){
  var v = [];
  ls.forEach(function(l){
    var p = perPyeong(l.price, l.land);
    if (p) v.push(p);
  });
  if (v.length < 2) return null;
  return Math.round(v.reduce(function(a,b){return a+b;},0) / v.length);
}

function ppTag(pp, avg){
  if (!pp || !avg) return '';
  var d = Math.round((pp - avg) / avg * 100);
  if (d >= 12)  return '<span class="tag hi">동네 평균보다 ' + d + '% 비싸요</span>';
  if (d <= -12) return '<span class="tag lo">동네 평균보다 ' + (-d) + '% 싸요</span>';
  return '<span class="tag ok">동네 평균과 비슷해요</span>';
}

function listSection(p){
  var ls = listingsOf(p.nm);
  var demo = (typeof DEMO_MODE !== 'undefined' && DEMO_MODE);

  if (!ls.length) {
    return '<div class="lsec">'
         + '<div class="card todo"><div class="cb">아직 등록된 매물이 없어요.<br>'
         + '중개사무소에서 올린 매물만 보여드립니다.</div></div></div>';
  }

  var avg = zoneAvgPP(ls);
  var h = '<div class="lsec">'
        + (demo ? '' : '')
        + (demo ? '<div class="card danger" style="margin-top:0;margin-bottom:10px">'
                + '<div class="cb">아래 매물은 <b>화면을 시험하려고 만든 가짜 정보</b>입니다. '
                + '가격·중개사무소 모두 실제가 아니니 절대 참고하지 마세요.</div></div>' : '');

  ls.sort(function(a,b){ return (a.price - deposit(a.tenant)) - (b.price - deposit(b.tenant)); });

  ls.forEach(function(l){
    var pp   = perPyeong(l.price, l.land);
    var dep  = deposit(l.tenant);
    var cash = l.price - dep;
    var py   = pyeong(l.land);
    var e    = estimate(l, p);

    h += '<div class="li" onclick="showListing(\'' + l.id + '\')">'
       + '<div class="top">'
       +   '<div class="cash">' + won(cash) + '원'
       +     '<u>지금 통장에 있어야 하는 돈</u>'
       +   '</div>'
       +   '<div class="kind">' + l.type + (l.floor && l.type==='빌라' ? ' ' + l.floor.split(' /')[0] : '') + '</div>'
       + '</div>';

    if (e) {
      h += '<div class="fin">'
         + '<div><span>새 아파트까지 총</span><b>' + won(e.mid.total) + '원</b></div>'
         + '<div class="sm"><span>나중에 더 낼 돈</span><b>' + won(e.mid.share) + '원</b></div>'
         + '</div>';
    }

    h += '<div class="rows">'
       +   '집값 ' + won(l.price) + (dep ? ' · 전세 ' + won(dep) + ' 승계' : ' · 세입자 없음') + '<br>'
       +   (py ? '내 몫의 땅 <b>' + py + '평</b>' + (pp ? ' · 1평에 ' + pp.toLocaleString('ko-KR') + '만원' : '') + '<br>' : '')
       +   (l.builtYear ? '<b>' + l.builtYear + '년</b>에 지어진 집' : '')
       +   '<div>' + ppTag(pp, avg)
       +   (l.builtYear && l.builtYear >= 2015 ? '<span class="tag risk">최근에 지은 집 — 확인 필요</span>' : '')
       +   (l.verified ? '<span class="tag ok">서류 확인됨</span>' : '')
       +   '</div>'
       + '</div>'
       + '<div class="ag">' + l.agency + '</div>'
       + '</div>';
  });

  h += '<div class="p2" style="margin-top:6px">지금 필요한 돈이 적은 순서로 보여드려요.<br>'
     + '전세가 있으면 그만큼 덜 들지만, 나중에 돌려줘야 할 돈입니다.</div>';
  h += '</div>';
  return h;
}

/* ============================================================
   총투자금 추정
   총투자금 = 매매가 + 추정분담금 + 부대비용
   추정분담금 = 조합원분양가 − 권리가액(추정감정가 × 비례율)

   비례율은 확정 전까지 흔들리므로 90~110% 범위로 계산합니다.
   ============================================================ */
/* 추정 감정가 — 면적으로 계산
   땅값이 대부분이고, 건물은 낡을수록 값이 거의 안 붙습니다.  */
function appraise(l, z){
  if (l.appraisal) return { v: l.appraisal, how: 'direct' };
  if (!z || !z.apprLand || !l.land) return null;

  var landPy = l.land / 3.3058;
  var landVal = Math.round(landPy * z.apprLand);

  /* 건물: 지은 지 오래될수록 값이 떨어지고, 40년 넘으면 거의 0 */
  var bldgVal = 0, bldgPy = 0;
  if (l.area && z.apprBldg) {
    bldgPy = l.area / 3.3058;
    var age = (new Date().getFullYear()) - (l.builtYear || 1990);
    var left = Math.max(0, 1 - age / 40);
    bldgVal = Math.round(bldgPy * z.apprBldg * left);
  }
  return {
    v: landVal + bldgVal,
    how: 'calc',
    landPy: Math.round(landPy*10)/10, landVal: landVal,
    bldgPy: Math.round(bldgPy*10)/10, bldgVal: bldgVal,
    perPy: z.apprLand
  };
}

function estimate(l, z){
  var ap = appraise(l, z);
  if (!z || !z.bunyang || !ap) return null;

  var out = [];
  [0.90, 1.00, 1.10].forEach(function(r){
    var right = Math.round(ap.v * r);               /* 권리가액 */
    var share = Math.max(0, z.bunyang - right);      /* 분담금 */
    var extra = Math.round((l.price + share) * 0.055); /* 세금·수수료·이자 개략 */
    out.push({ ratio: Math.round(r*100), share: share, total: l.price + share + extra });
  });
  return { lo: out[2], mid: out[1], hi: out[0], appr: ap,
           extra: Math.round((l.price + out[1].share) * 0.055) };
}

function estimateBlock(l, z){
  var e = estimate(l, z);

  if (!e) {
    return '<div class="card warn">'
      + '<div class="ct">그래서 최종적으로 얼마냐면</div>'
      + '<div class="cb"><b>아직 계산할 수 없습니다.</b><br><br>'
      + '새 아파트를 받으려면 나중에 돈을 더 내야 하는데, 그 금액은 '
      + (z && !z.bunyang ? '이 동네의 <b>새 아파트 값</b>이 정해져야' : '이 집의 <b>값이 매겨져야</b>')
      + ' 나옵니다.<br>'
      + '지금 보이는 ' + won(l.price) + '원은 <b>시작 금액일 뿐</b>입니다.</div>'
      + '</div>';
  }

  var a = e.appr;
  var h = '';

  if (a.how === 'calc') {
    h += '<div class="card info">'
       + '<div class="ct2">이 집을 얼마로 쳐줄까</div>'
       + '<div class="cb">조합은 <b>땅 넓이</b>를 기준으로 값을 매깁니다.<br><br>'
       + '땅 <b>' + a.landPy + '평</b> × 1평에 ' + a.perPy.toLocaleString('ko-KR') + '만원 = <b>' + won(a.landVal) + '</b>'
       + (a.bldgVal > 0
          ? '<br>건물 ' + a.bldgPy + '평 = ' + won(a.bldgVal) + ' <span style="opacity:.7">(낡을수록 거의 안 쳐줍니다)</span>'
          : '<br>건물은 너무 낡아서 <b>값이 거의 안 붙어요</b>')
       + '<br><br>합쳐서 <b>' + won(a.v) + '원</b>쯤으로 봅니다.<br>'
       + '<b>매매가 ' + won(l.price) + '원 중 ' + won(l.price - a.v) + '원은 웃돈</b>인 셈이에요.</div>'
       + '<div class="cn">↳ 부동산에서는 값을 매기는 걸 "감정평가", 웃돈을 "프리미엄"이라고 합니다</div>'
       + '</div>';
  }

  h += '<div class="card total">'
    + '<div class="tt">새 아파트 한 채를 받기까지</div>'
    + '<div class="tv">' + won(e.mid.total) + '원쯤</div>'
    + '<div class="bandbar"><div class="fill" style="left:8%;right:8%"></div>'
    +   '<div class="p50" style="left:' + Math.round(8 + 84*(e.mid.total-e.lo.total)/(e.hi.total-e.lo.total||1)) + '%"></div></div>'
    + '<div class="bandlab"><span>' + won(e.lo.total) + '</span>'
    +   '<span>잘 풀리면 ↔ 안 풀리면</span>'
    +   '<span>' + won(e.hi.total) + '</span></div>'
    + '<div class="tb">'
    +   '<div><span>지금 내는 집값</span><b>' + won(l.price) + '</b></div>'
    +   '<div><span>나중에 더 낼 돈</span><b>' + won(e.mid.share) + '</b></div>'
    +   '<div><span>세금·수수료</span><b>' + won(e.extra) + '</b></div>'
    + '</div>'
    + '<div class="tn">이 동네가 정한 새 아파트 값에서, 이 집의 값어치를 뺀 만큼을 더 냅니다.<br>'
    + '<b>추정치예요.</b> 공사비가 오르면 더 낼 수 있습니다.</div>'
    + '</div>';

  /* 인근 신축과 비교 */
  if (z.newPrice) {
    var gap = z.newPrice - e.mid.total;
    h += '<div class="card ' + (gap > 0 ? 'info' : 'danger') + '">'
       + '<div class="ct2">지금 사는 것과 비교하면</div>'
       + '<div class="cb">이 동네 새 아파트는 지금 <b>' + won(z.newPrice) + '원</b>이에요.<br><br>'
       + (gap > 0
          ? '기다려서 받으면 <b>' + won(gap) + '원</b>쯤 아끼는 셈입니다. '
            + '다만 그동안 돈이 묶이고, 공사비가 오르면 이 차이는 줄어들어요.'
          : '기다려서 받는 게 <b>' + won(-gap) + '원 더 비쌉니다.</b> '
            + '지금 완성된 아파트를 사는 쪽이 나을 수 있어요.')
       + '</div></div>';
  }

  /* 비례율 민감도 */
  h += '<div class="card todo">'
     + '<div class="ct2">이 숫자가 흔들리는 이유</div>'
     + '<div class="cb">사업이 잘 풀리면 <b>' + won(e.lo.total) + '</b>, '
     + '안 풀리면 <b>' + won(e.hi.total) + '</b>이에요. '
     + '차이가 ' + won(e.hi.total - e.lo.total) + '원이나 납니다.<br><br>'
     + '집값을 얼마로 쳐주느냐에 따라 갈리는데, 요즘은 공사비가 올라서 '
     + '<b>나쁜 쪽에 가까운 경우가 많습니다.</b></div>'
     + '<div class="cn">↳ 부동산에서는 "비례율"이라고 합니다</div>'
     + '</div>';

  return h;
}

/* 매물 하나를 눌렀을 때 — 해석 화면 */
function showListing(id){
  var l=null;
  for (var i=0;i<LISTINGS.length;i++) if (LISTINGS[i].id===id) l=LISTINGS[i];
  if (!l) return;

  var zn=null;
  for (var k=0;k<Z.length;k++) if (Z[k].nm === l.zone) zn = Z[k];

  var demo = l.demo || (typeof DEMO_MODE!=='undefined' && DEMO_MODE);
  var pp = perPyeong(l.price,l.land), py = pyeong(l.land);
  var dep = deposit(l.tenant), cash = l.price-dep;
  var tax = acqTax(l.price), taxAfter = Math.round(l.price*0.046);
  var e = estimate(l, zn);
  var a = e ? e.appr : appraise(l, zn);
  var avg = zoneAvgPP(listingsOf(l.zone));
  var risky = l.builtYear && l.builtYear >= 2015;

  var h = '<div class="back" onclick="paint(\'list\')">← 매물 목록으로</div>';

  if (demo) h += '<div class="excl" style="background:var(--danger-bg);border-color:var(--danger-brd);color:var(--danger)">'
              + '<b>이건 가짜 매물입니다.</b> 화면을 시험하려고 만든 예시라 가격·중개사무소 모두 실제가 아니에요.</div>';

  /* ① 판정 */
  if (risky) {
    h += '<div class="verdict bad"><div class="vt">먼저 확인하세요</div>'
       + '<div class="vh">' + l.builtYear + '년에 지어진 집이에요</div>'
       + '<div class="vd">최근에 지어졌거나 쪼개진 집은 새 아파트를 못 받을 수 있습니다. '
       + '이 동네의 기준 날짜와 이 집이 생긴 날을 꼭 대조하세요.</div></div>';
  } else if (e) {
    h += '<div class="verdict ok"><div class="vt">한눈에 보면</div>'
       + '<div class="vh">지금 ' + won(cash) + ',<br>끝까지 ' + won(e.mid.total) + '</div>'
       + '<div class="vd">' + (zn && zn.newPrice
           ? '이 동네 새 아파트는 지금 ' + won(zn.newPrice) + '원이에요. '
             + (zn.newPrice > e.mid.total ? '기다려서 받으면 ' + won(zn.newPrice-e.mid.total) + '쯤 아끼는 셈입니다.'
                                          : '지금 완성된 아파트를 사는 쪽이 쌀 수 있어요.')
           : '') + '</div></div>';
  }

  h += '<div class="nm">' + l.zone + '의 ' + l.type + '</div>'
     + '<div class="sb">' + (l.floor||'') + (l.builtYear ? ' · ' + l.builtYear + '년에 지어짐' : '') + '</div>';

  /* ② 지표 */
  h += '<div style="margin-top:16px">'
     + '<div class="metric"><div class="mrow"><div class="mlab">지금 통장에 있어야 하는 돈</div>'
     +   '<div class="mval">' + won(cash) + '</div></div>'
     +   '<div class="msub">' + (dep ? '집값 ' + won(l.price) + ' 중 전세 ' + won(dep) + '을 그대로 두고 사는 경우'
                                     : '세입자가 없어서 집값을 다 내야 해요') + '</div></div>';

  if (a) {
    h += '<div class="metric"><div class="mrow"><div class="mlab">조합이 쳐줄 이 집 값어치</div>'
       +   '<div class="mval">' + won(a.v) + '</div></div>'
       +   '<div class="msub">매매가 중 <b>' + won(l.price-a.v) + '은 웃돈</b>인 셈이에요</div></div>';
  }
  if (py) {
    h += '<div class="metric"><div class="mrow"><div class="mlab">내 몫의 땅</div>'
       +   '<div class="mval">' + py + '평</div></div>'
       +   '<div class="msub">1평에 ' + (pp?pp.toLocaleString('ko-KR'):'-') + '만원 '
       +   ppTag(pp,avg) + '</div></div>';
  }
  h += '<div class="metric"><div class="mrow"><div class="mlab">집 살 때 내는 세금</div>'
     +   '<div class="mval">' + won(tax) + '</div></div>'
     +   '<div class="msub">건물이 헐린 뒤에 사면 <b>' + won(taxAfter) + '</b>으로 뜁니다</div></div>'
     + '</div>';

  /* ③ 총액 */
  h += estimateBlock(l, zn);

  /* ④ 근거 */
  if (a && a.how === 'calc') {
    h += '<div class="card todo"><div class="ct2">이 값이 어떻게 나왔냐면</div>'
       + '<div class="basis" style="margin-top:8px">'
       +   '<div class="kv"><span>땅 ' + a.landPy + '평 × 1평에 ' + a.perPy.toLocaleString('ko-KR') + '만원</span><span class="v">' + won(a.landVal) + '</span></div>'
       +   '<div class="kv"><span>건물 ' + a.bldgPy + '평 (낡을수록 감가)</span><span class="v">' + won(a.bldgVal) + '</span></div>'
       +   '<div class="kv"><span>조합이 쳐줄 값어치</span><span class="v">' + won(a.v) + '</span></div>'
       + '</div>'
       + '<div class="cn">재개발에서는 건물이 아니라 <b>땅 넓이</b>가 값을 좌우해요. 어차피 헐릴 건물이니까요.</div></div>';
  }

  /* ⑤ 할 일 */
  h += '<div class="card todo"><div class="ct2">계약하기 전에 꼭 하세요</div>'
     + '<div style="margin-top:8px">'
     + '<div class="flag"><div class="fi">1</div><div><div class="ft">등기부등본 떼보기</div>'
     +   '<div class="fd">이 집이 언제 생겼는지 확인 · 인터넷등기소 700원</div></div></div>'
     + '<div class="flag"><div class="fi">2</div><div><div class="ft">조합에 전화하기</div>'
     +   '<div class="fd">"이 물건 새 아파트 나오나요"라고 물어보세요</div></div></div>'
     + '<div class="flag"><div class="fi">3</div><div><div class="ft">계약서에 특약 넣기</div>'
     +   '<div class="fd">"자격이 안 되면 계약을 무효로 한다" · 이걸 빠뜨리면 돈을 못 돌려받습니다</div></div></div>'
     + '</div></div>';

  h += '<div class="sc">'
     + (demo ? '<b style="color:var(--danger)">※ 예시 데이터 — 실제 매물 아님</b><br>' : '')
     + '<b>매물 등록: ' + l.agency + '</b>' + (l.agencyTel ? ' · ' + l.agencyTel : '') + '<br>'
     + '가격·면적·층은 중개사무소가 제공한 정보입니다.<br>'
     + '값어치와 세금은 ToadStep이 계산한 추정치이며 실제와 다를 수 있습니다.<br>'
     + (l.updated ? '정보 기준일 ' + l.updated : '') + '</div>';

  /* ⑥ 하단 고정 금액바 */
  h += '<div class="cashbar"><div class="row">'
     + '<div class="lab">지금 필요한 돈</div><div class="val">' + won(cash) + '</div></div>'
     + '<div class="hint"><span>끝까지 다 하면</span><b>' + (e ? won(e.mid.total) : '아직 계산 불가') + '</b></div></div>';

  document.getElementById('bd').innerHTML=h;
  reveal();
}

function reveal(){
  var kids = document.getElementById('bd').children;
  for (var i = 0; i < kids.length; i++) {
    kids[i].style.animationDelay = Math.min(i * 130, 2200) + 'ms';
  }
  var sh = document.getElementById('sh');
  sh.scrollTop = 0;
}

function showSmall(p){
  var h='';
  h += '<div class="nm">' + p.nm + '</div>'
     + '<div class="sb">' + p.gu + ' · ' + (SMALL_NAME[p.kind]||'') + '</div>';

  h += '<div class="st" style="background:var(--info-bg);color:#22406F;border:1px solid var(--info-brd)">'
     + (p.kind === 'moa'
        ? '여러 집을 묶어 한 번에 새로 짓는 동네예요. 재개발보다 작고 빠릅니다'
        : '한 블록을 묶어 아파트로 짓는 사업이에요. 재개발보다 훨씬 작습니다')
     + '</div>';

  if (p.area) h += '<div class="p2">동네 넓이는 ' + p.area.toLocaleString('ko-KR') + '㎡예요</div>';

  h += '<div class="card info">'
     + '<div class="ct2">재개발과 뭐가 다르냐면</div>'
     + '<div class="cb"><b>빠릅니다.</b> 재개발은 보통 15년 넘게 걸리지만 여기는 훨씬 짧아요.<br><br>'
     + '<b>대신 낼 돈이 큽니다.</b> 규모가 작아서 팔 수 있는 집이 적거든요. '
     + '남는 집을 팔아 공사비를 메우는데, 그게 적으면 집주인이 더 내야 합니다.<br><br>'
     + '재개발과 같은 기준으로 비교하면 안 돼요. '
     + '<b>빠르지만 비싼 쪽</b>과 <b>느리지만 여유 있는 쪽</b> 중 무엇을 택할지의 문제입니다.</div>'
     + '</div>';

  h += '<div class="card todo">'
     + '<div class="ct2">한 가지 다행인 점</div>'
     + '<div class="cb">이런 사업은 재개발과 다른 법을 따라서, '
     + '<b>중간에 사도 자격을 못 받는 구간이 없습니다.</b><br>'
     + '다만 새 아파트를 받을 자격 자체는 따로 따지니, 조합에 꼭 확인하세요.</div>'
     + '</div>';

  h += '<div class="card todo"><div class="ct2">아직 확인 못 한 것</div>'
     + '<div class="cb">몇 세대를 짓는지, 집주인이 몇 명인지, 지금 어디까지 왔는지 — 아직 못 넣었어요.<br>'
     + '구청 주택과나 조합에서 확인할 수 있습니다.</div></div>';

  h += '<div class="sc">구역 경계: 서울시 의제처리구역 공간정보<br>'
     + '출처: 서울특별시 (공공누리 제1유형)<br>'
     + '중요한 결정을 하기 전에는 반드시 원본 문서로 다시 확인하세요.</div>';

  document.getElementById('bd').innerHTML=h;
  reveal();
  document.getElementById('sh').classList.add('on');
}

var STAGE_ORDER = ['jijeong','chujin','johap','simui','saeop','gwanri','chakgong'];
var STAGE_TINY  = {jijeong:'구역\n지정',chujin:'추진위',johap:'조합\n설립',
                   simui:'건축\n심의',saeop:'사업\n시행',gwanri:'관리\n처분',chakgong:'착공'};

function timeline(stage){
  var cur = STAGE_ORDER.indexOf(stage);
  var h = '<div class="timeline">';
  STAGE_ORDER.forEach(function(k, i){
    var cls = i < cur ? 'done' : (i === cur ? 'now' : '');
    h += '<div class="tl-step ' + cls + '"><div class="dot2"></div>'
       + STAGE_TINY[k].replace('\n','<br>') + '</div>';
  });
  return h + '</div>';
}

function zoneInfo(p){
  var late = TOO_LATE[p.stage];
  var yr = p.jj ? (new Date().getFullYear() - parseInt(String(p.jj).slice(0,4),10)) : null;
  var h = '';

  /* ① 판정 — 사도 되는 동네인가 */
  if (late) {
    h += '<div class="verdict bad">'
       + '<div class="vt">지금은 사면 안 돼요</div>'
       + '<div class="vh">사도 새 아파트를<br>못 받을 수 있습니다</div>'
       + '<div class="vd">낼 돈과 평형이 이미 정해진 동네예요. 지금 사면 아파트 대신 '
       + '현금으로 정산받고 나가게 됩니다. 예외는 아래에 있어요.</div></div>';
  } else if (p.stage === 'saeop' || p.stage === 'simui') {
    h += '<div class="verdict warn">'
       + '<div class="vt">막바지에 가까워요</div>'
       + '<div class="vh">아직 살 수 있지만<br>웃돈이 이미 붙었습니다</div>'
       + '<div class="vd">곧 집집마다 값이 매겨집니다. 기다린 시간이 짧은 대신 '
       + '들어가는 돈이 큽니다.</div></div>';
  } else {
    h += '<div class="verdict ok">'
       + '<div class="vt">아직 이른 편이에요</div>'
       + '<div class="vh">살 수는 있지만<br>오래 기다려야 합니다</div>'
       + '<div class="vd">' + (STAGE_TXT[p.stage]||'') + '</div></div>';
  }

  /* ② 단계 타임라인 */
  h += '<div class="stage-badge">지금 ' + (STAGE_SHORT[p.stage]||'') + ' 단계</div>'
     + timeline(p.stage);

  /* ③ 지표 */
  h += '<div style="margin-top:16px">';
  if (yr !== null) {
    h += '<div class="metric"><div class="mrow"><div class="mlab">재개발로 정해진 지</div>'
       + '<div class="mval">' + yr + '년째</div></div>'
       + '<div class="msub">' + String(p.jj).slice(0,4) + '년에 정해졌어요</div></div>';
  }
  h += '<div class="metric"><div class="mrow"><div class="mlab">여기서 낼 돈이 정해지기까지</div>'
     + '<div class="mval' + (late?' na':'') + '">' + (late ? '이미 정해짐' : '보통 ' + restYears(p) + '년') + '</div></div>'
     + '<div class="msub">서울에서 실제로 끝난 87곳 기준</div></div>';

  h += '<div class="metric"><div class="mrow"><div class="mlab">새로 짓는 집</div>'
     + '<div class="mval' + (p.tot?'':' na') + '">' + (p.tot ? p.tot.toLocaleString('ko-KR') + '세대' : '미확인') + '</div></div>'
     + (p.bun ? '<div class="msub">그중 ' + p.bun.toLocaleString('ko-KR') + '세대가 분양이에요'
              + (p.lim ? ' · 임대 ' + p.lim.toLocaleString('ko-KR') + '세대' : '') + '</div>' : '')
     + '</div>';

  h += '<div class="metric"><div class="mrow"><div class="mlab">집주인이 몇 명인지</div>'
     + '<div class="mval na">아직 못 넣었어요</div></div>'
     + '<div class="msub">이걸 알아야 팔 수 있는 집이 몇 채인지 계산됩니다</div></div>';
  h += '</div>';

  /* ④ 확인할 것 */
  h += '<div class="card todo" style="margin-top:18px"><div class="ct2">이 동네에서 확인할 것</div>'
     + '<div style="margin-top:8px">'
     + '<div class="flag hit"><div class="fi">⚠</div><div><div class="ft">기준 날짜 이후에 지어진 집</div>'
     +   '<div class="fd">그런 집은 새 아파트가 안 나옵니다. 등기부등본으로 확인하세요</div></div></div>'
     + '<div class="flag"><div class="fi">·</div><div><div class="ft">전세를 끼고 살 수 있는지</div>'
     +   '<div class="fd">구청 허가가 필요한 동네면 직접 들어가 살아야 합니다</div></div></div>'
     + '<div class="flag"><div class="fi">·</div><div><div class="ft">이 물건에 자격이 있는지</div>'
     +   '<div class="fd">조합 사무실에 직접 물어보는 게 가장 확실합니다</div></div></div>'
     + '</div></div>';

  /* ⑤ 늦은 구역이면 예외 안내 */
  if (late) {
    h += '<div class="excl">그래도 <b>집주인이 10년 넘게 갖고 5년 넘게 살았거나</b>, '
       + '사업이 오래 멈춰 있었다면 자격을 물려받을 수 있습니다. '
       + '파는 사람 사정으로 정해지니 조합에 꼭 확인하세요.</div>';
  }

  h += '<div class="sc">구역 경계: 서울시 의제처리구역 공간정보 · 추진 단계: 서울시 정비사업 추진현황(2026.6월)<br>'
     + '출처: 서울특별시 (공공누리 제1유형)<br>'
     + '중요한 결정을 하기 전에는 반드시 원본 문서로 다시 확인하세요.</div>';
  return h;
}

function restYears(p){
  var R = {jijeong:13, chujin:12, johap:9, simui:4, saeop:2};
  return R[p.stage] || 9;
}

/* 구역 시트 — 정보 / 매물 두 탭 */
var CUR = null;

function show(p){
  CUR = p;
  paint('info');
  document.getElementById('sh').classList.add('on');
}

function paint(tab){
  var p = CUR;
  if (!p) return;
  var n = listingsOf(p.nm).length;

  var h = '<div class="nm">' + p.nm + '</div>'
        + '<div class="sb">' + p.gu + ' · ' + (p.addr||'') + '</div>'
        + '<div class="seg">'
        +   '<button class="' + (tab==='info'?'on':'') + '" onclick="paint(\'info\')">구역 정보</button>'
        +   '<button class="' + (tab==='list'?'on':'') + '" onclick="paint(\'list\')">매물 ' + n + '건</button>'
        + '</div>';

  h += (tab === 'list') ? listSection(p) : zoneInfo(p);

  document.getElementById('bd').innerHTML = h;
  reveal();
}

} catch (e) {
  fail('<b>코드 오류</b><br><br>' + e.message);
}
</script>
